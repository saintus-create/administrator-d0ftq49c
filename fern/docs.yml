# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: notes-428082.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: administrator-d0ftq49c
        branch: main
      launch: dashboard
title: Notes | Documentation
layout:
  searchbar-placement: sidebar
  page-width: full
  tabs-placement: sidebar
tabs:
  home:
    display-name: Docs
    icon: home
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Edit your docs
            path: docs/pages/editing-your-docs.mdx
            icon: fa-duotone fa-pen-to-square
          - page: Write content
            path: docs/pages/writing-content.mdx
            icon: fa-duotone fa-file-lines
          - page: Set up navigation
            path: docs/pages/navigation.mdx
            icon: fa-duotone fa-sitemap
          - page: Customize your docs
            path: docs/pages/customization.mdx
            icon: fa-duotone fa-palette
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
      - section: Changelog
        contents:
          - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#000000"
    dark: "#FFFFFF"
  background:
    light: "#FFFFFF"
    dark: "#1F1F1F"
  card-background:
    dark: "#1a1a1c"
    light: "#FFFFFF"
  border:
    light: "#FFFFFF"
    dark: "#1F1F1F"
theme:
  page-actions: toolbar
  footer-nav: minimal
  body: canvas
  tabs: bubble
  sidebar: minimal
logo:
  dark: docs/assets/logo-dark.png
  light: docs/assets/logo-light.png
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.png
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
